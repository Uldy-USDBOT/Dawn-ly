<script>
const duas = [
["دعاء الاستفتاح","سبحانك اللهم وبحمدك، وتبارك اسمك، وتعالى جدّك، ولا إله غيرك."],
["دعاء الاستخارة","اللهم إني أستخيرك بعلمك، وأستقدرك بقدرتك، وأسألك من فضلك العظيم، فإنك تقدر ولا أقدر، وتعلم ولا أعلم، وأنت علام الغيوب."],
["سيد الاستغفار","اللهم أنت ربي لا إله إلا أنت، خلقتني وأنا عبدك، وأنا على عهدك ووعدك ما استطعت، أعوذ بك من شر ما صنعت، أبوء لك بنعمتك عليّ، وأبوء بذنبي فاغفر لي فإنه لا يغفر الذنوب إلا أنت."],
["دعاء أصبحنا وأصبح الملك لله","اللهم بك أصبحنا، وبك أمسينا، وبك نحيا وبك نموت، وإليك النشور."],
["دعاء أمسينا وأمسى الملك لله","اللهم بك أمسينا، وبك أصبحنا، وبك نحيا وبك نموت، وإليك المصير."],
["دعاء الاستيقاظ من النوم","الحمد لله الذي أحيانا بعد ما أماتنا وإليه النشور."],
["دعاء النوم","باسمك اللهم أموت وأحيا."],
["دعاء دخول المنزل","بسم الله ولجنا، وبسم الله خرجنا، وعلى ربنا توكلنا."],
["دعاء الخروج من المنزل","بسم الله، توكلت على الله، ولا حول ولا قوة إلا بالله."],
["دعاء دخول المسجد","اللهم افتح لي أبواب رحمتك."],
["دعاء الخروج من المسجد","اللهم إني أسألك من فضلك."],
["دعاء قبل الطعام","بسم الله."],
["دعاء إذا نسي البسملة في أوله","بسم الله في أوله وآخره."],
["دعاء بعد الطعام","الحمد لله الذي أطعمني هذا، ورزقنيه من غير حول مني ولا قوة."],
["دعاء دخول الخلاء","اللهم إني أعوذ بك من الخُبُث والخبائث."],
["دعاء الخروج من الخلاء","غفرانك."],
["دعاء لبس الثوب الجديد","اللهم لك الحمد أنت كسوتنيه، أسألك خيره وخير ما صُنع له، وأعوذ بك من شره وشر ما صُنع له."],
["دعاء السفر","الله أكبر، الله أكبر، الله أكبر، سبحان الذي سخّر لنا هذا وما كنا له مقرنين، وإنا إلى ربنا لمنقلبون."],
["دعاء ركوب وسيلة النقل","سبحان الذي سخّر لنا هذا وما كنا له مقرنين، وإنا إلى ربنا لمنقلبون."],
["دعاء دخول السوق","لا إله إلا الله وحده لا شريك له، له الملك وله الحمد، يحيي ويميت وهو حي لا يموت، بيده الخير وهو على كل شيء قدير."],
["دعاء الكرب","لا إله إلا الله العظيم الحليم، لا إله إلا الله رب العرش العظيم، لا إله إلا الله رب السماوات ورب الأرض ورب العرش الكريم."],
["دعاء الهم والحزن","اللهم إني عبدك ابن عبدك ابن أمتك، ناصيتي بيدك، ماضٍ فيّ حكمك، عدل فيّ قضاؤك، أسألك بكل اسم هو لك... أن تجعل القرآن ربيع قلبي ونور صدري وجلاء حزني وذهاب همي."],
["دعاء يونس عليه السلام","لا إله إلا أنت سبحانك إني كنت من الظالمين."],
["دعاء الفزع","أعوذ بكلمات الله التامة من غضبه وعقابه، وشر عباده، ومن همزات الشياطين وأن يحضرون."],
["دعاء عند رؤية ما يعجبه","ما شاء الله لا قوة إلا بالله."],
["دعاء عند سماع الرعد","سبحان الذي يسبّح الرعد بحمده والملائكة من خيفته."],
["دعاء عند هبوب الريح","اللهم إني أسألك خيرها وخير ما فيها وخير ما أُرسلت به، وأعوذ بك من شرها وشر ما فيها وشر ما أُرسلت به."],
["دعاء نزول المطر","اللهم صيّبًا نافعًا."],
["دعاء بعد المطر","مُطرنا بفضل الله ورحمته."],
["دعاء قنوت الوتر","اللهم اهدني فيمن هديت، وعافني فيمن عافيت، وتولّني فيمن توليت، وبارك لي فيما أعطيت، وقني شر ما قضيت، فإنك تقضي ولا يُقضى عليك، إنه لا يذل من واليت."],
["دعاء ليلة القدر","اللهم إنك عفوّ تحب العفو فاعفُ عني."],
["دعاء الإفطار","ذهب الظمأ، وابتلّت العروق، وثبت الأجر إن شاء الله."],
["دعاء لمن أفطرتَ عنده","أفطر عندكم الصائمون، وأكل طعامكم الأبرار، وصلّت عليكم الملائكة."],
["دعاء لعيادة المريض","لا بأس، طهور إن شاء الله."],
["دعاء الشفاء للمريض","أسأل الله العظيم رب العرش العظيم أن يشفيك."],
["دعاء عند المصيبة","إنّا لله وإنّا إليه راجعون، اللهم أجرني في مصيبتي واخلف لي خيرًا منها."],
["دعاء للميت","اللهم اغفر له وارحمه، وعافه واعف عنه."],
["دعاء قضاء الدَّين","اللهم اكفني بحلالك عن حرامك، وأغنني بفضلك عمن سواك."],
["دعاء طلب العلم","رب زدني علمًا."],
["دعاء عند الغضب","أعوذ بالله من الشيطان الرجيم."],
["دعاء بعد الوضوء","أشهد أن لا إله إلا الله وحده لا شريك له، وأشهد أن محمدًا عبده ورسوله."],
["دعاء بداية الوضوء","بسم الله."],
["دعاء ختم الدعاء (ربنا آتنا)","ربنا آتنا في الدنيا حسنة، وفي الآخرة حسنة، وقنا عذاب النار."],
["دعاء طلب الرزق الحلال","اللهم اكفني بحلالك عن حرامك، وأغنني بفضلك عمن سواك."],
["دعاء طلب الذرية الصالحة","ربّ هب لي من لدنك ذرية طيبة، إنك سميع الدعاء."],
["دعاء للوالدين","ربّ ارحمهما كما ربياني صغيرًا."],
["دعاء الثبات على الدين","يا مقلّب القلوب ثبّت قلبي على دينك."],
["دعاء دفع الوسواس","آمنت بالله ورسله."],
["دعاء عند الفرح والنعمة","الحمد لله الذي بنعمته تتم الصالحات."],
["كفارة المجلس","سبحانك اللهم وبحمدك، أشهد أن لا إله إلا أنت، أستغفرك وأتوب إليك."],
["دعاء الرزق والدَّين معًا","اللهم اكفني بحلالك عن حرامك، وأغنني بفضلك عمّن سواك."],
["دعاء التوفيق في الأمر","اللهم لا سهل إلا ما جعلته سهلًا، وأنت تجعل الحزن إذا شئت سهلًا."],
["دعاء عند دخول الحمّام/الاستحمام","بسم الله."],
["دعاء لمن قال لك: بارك الله فيك","وفيك بارك الله."],
["دعاء السلامة من الديون والغم","اللهم إني أعوذ بك من الهمّ والحزن، والعجز والكسل، والبخل والجبن، وضلع الدَّين وغلبة الرجال."],
["دعاء طلب حسن الخاتمة","اللهم أحسن عاقبتنا في الأمور كلها، وأجرنا من خزي الدنيا وعذاب الآخرة."],
["دعاء الاستعاذة من فتنة الدجال وعذاب القبر","اللهم إني أعوذ بك من عذاب جهنم، ومن عذاب القبر، ومن فتنة المحيا والممات، ومن شر فتنة المسيح الدجال."],
["دعاء صلاة الاستخارة (خاتمته)","فاقدره لي، ويسّره لي، ثم بارك لي فيه."],
["دعاء عند الإفاقة من نوم مزعج/فزع في المنام","أعوذ بكلمات الله التامات من غضبه وعقابه، وشر عباده، ومن همزات الشياطين وأن يحضرون."],
["دعاء لصاحب الدَّين له عليك حق","بارك الله لك في أهلك ومالك، إنما جزاء السلف الحمد والأداء."],
["دعاء عند لبس الثوب (عام)","الحمد لله الذي كساني هذا وما كان لي من قوة ولا حول."],
["دعاء الخوف من قوم","اللهم إنا نجعلك في نحورهم، ونعوذ بك من شرورهم."],
["دعاء طلب العافية","اللهم إني أسألك العفو والعافية في الدنيا والآخرة."],
["دعاء ختام القرآن (عند الفراغ من الختمة)","اللهم ارحمني بالقرآن، واجعله لي إمامًا ونورًا وهدى ورحمة."]
];
const duaListEl = document.getElementById('duaList');
function renderDuas(filter=''){
  const f = filter.trim();
  duaListEl.innerHTML = duas.map((d,i)=>{
    if(f && !d[0].includes(f) && !d[1].includes(f)) return '';
    return `<div class="item-card"><h3>${i+1}. ${d[0]}</h3><div class="arabic">${d[1]}</div></div>`;
  }).join('');
}
renderDuas();
document.getElementById('duaSearch').addEventListener('input', e=>renderDuas(e.target.value));
</script>
<script src="app.js"></script>
