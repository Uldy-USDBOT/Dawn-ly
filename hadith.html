<script>
const hadiths = [
["إنما الأعمال بالنيات، وإنما لكل امرئ ما نوى، فمن كانت هجرته إلى الله ورسوله فهجرته إلى الله ورسوله، ومن كانت هجرته لدنيا يصيبها أو امرأة ينكحها فهجرته إلى ما هاجر إليه.", "رواه البخاري ومسلم — عن عمر بن الخطاب رضي الله عنه"],
["الإسلام أن تشهد أن لا إله إلا الله وأن محمدًا رسول الله، وتقيم الصلاة، وتؤتي الزكاة، وتصوم رمضان، وتحج البيت إن استطعت إليه سبيلًا. والإيمان أن تؤمن بالله وملائكته وكتبه ورسله واليوم الآخر، وتؤمن بالقدر خيره وشره. والإحسان أن تعبد الله كأنك تراه، فإن لم تكن تراه فإنه يراك. [حديث جبريل عليه السلام]", "رواه مسلم — عن عمر بن الخطاب رضي الله عنه"],
["بُني الإسلام على خمس: شهادة أن لا إله إلا الله وأن محمدًا رسول الله، وإقام الصلاة، وإيتاء الزكاة، وحج البيت، وصوم رمضان.", "رواه البخاري ومسلم — عن ابن عمر رضي الله عنهما"],
["إن أحدكم يُجمَع خلقه في بطن أمه أربعين يومًا نطفة، ثم يكون علقة مثل ذلك، ثم يكون مضغة مثل ذلك، ثم يُرسَل إليه الملَك فينفخ فيه الروح، ويُؤمَر بأربع كلمات: بكتب رزقه وأجله وعمله وشقيّ أو سعيد.", "رواه البخاري ومسلم — عن ابن مسعود رضي الله عنه"],
["من أحدث في أمرنا هذا ما ليس منه فهو ردّ.", "رواه البخاري ومسلم — عن عائشة رضي الله عنها"],
["إن الحلال بيّن، وإن الحرام بيّن، وبينهما أمور مشتبهات لا يعلمهن كثير من الناس، فمن اتقى الشبهات فقد استبرأ لدينه وعرضه، ومن وقع في الشبهات وقع في الحرام.", "رواه البخاري ومسلم — عن النعمان بن بشير رضي الله عنهما"],
["الدين النصيحة، قلنا: لمن؟ قال: لله ولكتابه ولرسوله ولأئمة المسلمين وعامتهم.", "رواه مسلم — عن تميم الداري رضي الله عنه"],
["أُمرت أن أقاتل الناس حتى يشهدوا أن لا إله إلا الله وأن محمدًا رسول الله، ويقيموا الصلاة، ويؤتوا الزكاة، فإذا فعلوا ذلك عصموا مني دماءهم وأموالهم إلا بحق الإسلام، وحسابهم على الله.", "رواه البخاري ومسلم — عن ابن عمر رضي الله عنهما"],
["ما نهيتكم عنه فاجتنبوه، وما أمرتكم به فأْتوا منه ما استطعتم، فإنما أهلك الذين من قبلكم كثرة مسائلهم واختلافهم على أنبيائهم.", "رواه البخاري ومسلم — عن أبي هريرة رضي الله عنه"],
["إن الله تعالى طيّب لا يقبل إلا طيبًا، وإن الله أمر المؤمنين بما أمر به المرسلين.", "رواه مسلم — عن أبي هريرة رضي الله عنه"],
["دَعْ ما يريبك إلى ما لا يريبك.", "رواه الترمذي والنسائي — عن الحسن بن علي رضي الله عنهما"],
["من حسن إسلام المرء تركه ما لا يعنيه.", "رواه الترمذي — عن أبي هريرة رضي الله عنه"],
["لا يؤمن أحدكم حتى يحب لأخيه ما يحب لنفسه.", "رواه البخاري ومسلم — عن أنس بن مالك رضي الله عنه"],
["لا يحل دم امرئ مسلم يشهد أن لا إله إلا الله وأني رسول الله، إلا بإحدى ثلاث: الثيّب الزاني، والنفس بالنفس، والتارك لدينه المفارق للجماعة.", "رواه البخاري ومسلم — عن ابن مسعود رضي الله عنه"],
["من كان يؤمن بالله واليوم الآخر فليقل خيرًا أو ليصمت، ومن كان يؤمن بالله واليوم الآخر فليكرم جاره، ومن كان يؤمن بالله واليوم الآخر فليكرم ضيفه.", "رواه البخاري ومسلم — عن أبي هريرة رضي الله عنه"],
["لا تغضب. فردَّد مرارًا، قال: لا تغضب.", "رواه البخاري — عن أبي هريرة رضي الله عنه"],
["إن الله كتب الإحسان على كل شيء، فإذا قتلتم فأحسنوا القِتلة، وإذا ذبحتم فأحسنوا الذبح، وليُحدّ أحدكم شفرته فليُرِح ذبيحته.", "رواه مسلم — عن شداد بن أوس رضي الله عنه"],
["اتقِ الله حيثما كنت، وأتبِع السيئة الحسنة تمحُها، وخالِق الناس بخلق حسن.", "رواه الترمذي — عن معاذ بن جبل رضي الله عنه"],
["احفظ الله يحفظك، احفظ الله تجده تجاهك، إذا سألتَ فاسأل الله، وإذا استعنتَ فاستعن بالله، واعلم أن الأمة لو اجتمعت على أن ينفعوك بشيء لم ينفعوك إلا بشيء قد كتبه الله لك.", "رواه الترمذي — عن ابن عباس رضي الله عنهما"],
["إذا لم تستحِ فاصنع ما شئت.", "رواه البخاري — عن ابن مسعود رضي الله عنه"],
["قل آمنت بالله ثم استقم.", "رواه مسلم — عن سفيان بن عبد الله رضي الله عنه"],
["أفلح إن صدق، أو دخل الجنة إن صدق. [حديث السؤال عن أركان الإسلام]", "رواه البخاري ومسلم — عن طلحة بن عبيد الله رضي الله عنه"],
["الطُّهور شطر الإيمان، والحمد لله تملأ الميزان، وسبحان الله والحمد لله تملآن -أو تملأ- ما بين السماء والأرض، والصلاة نور، والصدقة برهان، والصبر ضياء، والقرآن حجة لك أو عليك.", "رواه مسلم — عن أبي مالك الأشعري رضي الله عنه"],
["يا عبادي إني حرّمت الظلم على نفسي وجعلته بينكم محرّمًا فلا تظالموا... [حديث قدسي]", "رواه مسلم — عن أبي ذر رضي الله عنه"],
["كل سُلامى من الناس عليه صدقة، كل يوم تطلع فيه الشمس: تعدل بين اثنين صدقة، وتعين الرجل في دابته صدقة، والكلمة الطيبة صدقة، وبكل خطوة تمشيها إلى الصلاة صدقة، وتميط الأذى عن الطريق صدقة.", "رواه البخاري ومسلم — عن أبي هريرة رضي الله عنه"],
["البِرّ حسن الخلق، والإثم ما حاك في صدرك وكرهت أن يطّلع عليه الناس.", "رواه مسلم — عن النواس بن سمعان رضي الله عنه"],
["أوصيكم بتقوى الله والسمع والطاعة... وإياكم ومحدثات الأمور، فإن كل بدعة ضلالة.", "رواه أبو داود والترمذي — عن العرباض بن سارية رضي الله عنه"],
["ألا أدلك على أبواب الخير؟ الصوم جُنّة، والصدقة تُطفئ الخطيئة كما يطفئ الماء النار...", "رواه الترمذي — عن معاذ بن جبل رضي الله عنه"],
["إن الله فرض فرائض فلا تضيّعوها، وحدّ حدودًا فلا تعتدوها، وحرّم أشياء فلا تنتهكوها، وسكت عن أشياء رحمة بكم من غير نسيان فلا تبحثوا عنها.", "رواه الدارقطني — عن أبي ثعلبة رضي الله عنه"],
["ازهد في الدنيا يحبك الله، وازهد فيما عند الناس يحبك الناس.", "رواه ابن ماجه — عن سهل بن سعد رضي الله عنه"],
["لا ضرر ولا ضرار.", "رواه ابن ماجه والدارقطني — عن أبي سعيد الخدري رضي الله عنه"],
["البيّنة على المدّعي، واليمين على من أنكر.", "رواه البيهقي — عن ابن عباس رضي الله عنهما"],
["من رأى منكم منكرًا فليغيّره بيده، فإن لم يستطع فبلسانه، فإن لم يستطع فبقلبه، وذلك أضعف الإيمان.", "رواه مسلم — عن أبي سعيد الخدري رضي الله عنه"],
["لا تحاسدوا، ولا تناجشوا، ولا تباغضوا، ولا تدابروا، ولا يبع بعضكم على بيع بعض، وكونوا عباد الله إخوانًا.", "رواه مسلم — عن أبي هريرة رضي الله عنه"],
["من نفّس عن مؤمن كربة من كرب الدنيا نفّس الله عنه كربة من كرب يوم القيامة، ومن يسّر على معسر يسّر الله عليه في الدنيا والآخرة...", "رواه مسلم — عن أبي هريرة رضي الله عنه"],
["إن الله كتب الحسنات والسيئات ثم بيّن ذلك: فمن همّ بحسنة فلم يعملها كتبها الله له عنده حسنة كاملة...", "رواه البخاري ومسلم — عن ابن عباس رضي الله عنهما"],
["من عادى لي وليًا فقد آذنته بالحرب، وما تقرّب إليّ عبدي بشيء أحبّ إليّ مما افترضته عليه... [حديث قدسي]", "رواه البخاري — عن أبي هريرة رضي الله عنه"],
["إن الله تجاوز لي عن أمتي الخطأ والنسيان وما استُكرهوا عليه.", "رواه ابن ماجه — عن ابن عباس رضي الله عنهما"],
["كن في الدنيا كأنك غريب أو عابر سبيل.", "رواه البخاري — عن ابن عمر رضي الله عنهما"],
["لا يؤمن أحدكم حتى يكون هواه تبعًا لما جئت به.", "حديث حسن صحيح — رواه أبو عمرو وأبو المظفر"],
["يا ابن آدم، إنك ما دعوتني ورجوتني غفرت لك على ما كان منك ولا أبالي... [حديث قدسي]", "رواه الترمذي — عن أنس بن مالك رضي الله عنه"]
];
document.getElementById('hadithList').innerHTML = hadiths.map((h,i)=>`
  <div class="item-card">
    <span class="idx">الحديث ${i+1}</span>
    <div class="arabic">${h[0]}</div>
    <div class="src">${h[1]}</div>
  </div>
`).join('');
</script>
