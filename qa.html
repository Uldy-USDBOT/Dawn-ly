<script>
const qaData = [
["الصيام","ما حكم الصيام في شهر رمضان؟","الصيام فرض عين على كل مسلم بالغ عاقل قادر مقيم، وتُستثنى المرأة الحائض والنفساء فتفطران وجوبًا ثم تقضيان."],
["الصيام","من يُرخَّص له بالإفطار في رمضان؟","المريض الذي يشقّ عليه الصوم أو يضره، والمسافر سفر قصر (يقضيان لاحقًا)، والحائض والنفساء (يفطران وتقضيان)، والشيخ الكبير والمريض الذي لا يُرجى برؤه (يُطعمان عن كل يوم مسكينًا بدل القضاء)، أما الحامل والمرضع فلهما تفصيل عند أهل العلم إذا خافتا على أنفسهما أو ولديهما."],
["الصيام","ما الذي يُبطل الصيام؟","الأكل والشرب متعمدًا، والجماع، وخروج المني بشهوة، وابتداء الحيض أو النفاس أثناء اليوم. أما القيء المتعمد فمُبطل عند جمهور الفقهاء، وفي بعض المسائل كالحجامة وابتلاع الريق تفصيل واختلاف بين أهل العلم."],
["الصيام","هل الأكل أو الشرب ناسيًا يُفطر الصائم؟","لا يُفطر؛ فمن أكل أو شرب ناسيًا وهو صائم فليتمّ صومه، فإنما أطعمه الله وسقاه، وهذا مذهب جمهور العلماء."],
["الصيام","ما حكم زكاة الفطر؟","واجبة على كل مسلم صغيرًا أو كبيرًا، ذكرًا أو أنثى، ومقدارها صاع من طعام (نحو 2.5 إلى 3 كيلوجرام تقريبًا) من قوت البلد الغالب، وتُخرج قبل صلاة عيد الفطر، ويجوز إخراجها قبل العيد بيوم أو يومين."],
["الصيام","ما حكم صيام يوم الشك (اليوم الذي يُشك في كونه من رمضان)؟","يُكره صيامه احتياطًا عند جمهور العلماء، إلا لمن كانت له عادة سابقة كصيام الاثنين والخميس فوافقت ذلك اليوم."],
["الزكاة","ما هو نصاب زكاة الذهب؟","نصاب الذهب خمسة وثمانون (85) جرامًا من الذهب الخالص فأكثر، فإذا بلغ المال هذا النصاب وحال عليه الحول (سنة هجرية كاملة) وجبت فيه الزكاة بمقدار 2.5% من قيمته."],
["الزكاة","ما هو نصاب زكاة الفضة؟","نصاب الفضة خمسمائة وخمسة وتسعون (595) جرامًا من الفضة الخالصة، والمقدار الواجب فيها أيضًا 2.5% بعد حولان الحول."],
["الزكاة","كيف تُحسب زكاة النقود وعروض التجارة؟","تُقدَّر الأموال النقدية والتجارية بما يعادل نصاب الذهب أو الفضة (وقد رجّح بعض العلماء اعتبار الأدنى منهما تحقيقًا لمصلحة الفقراء)، فمتى بلغت القيمة النصاب وحال عليها الحول وجبت فيها الزكاة بنسبة 2.5%."],
["الزكاة","لمن تُصرف أموال الزكاة؟","تُصرف للأصناف الثمانية الواردة في القرآن الكريم: الفقراء، والمساكين، والعاملين عليها، والمؤلفة قلوبهم، وفي الرقاب، والغارمين، وفي سبيل الله، وابن السبيل."],
["الزكاة","هل تجب الزكاة على المال المُقرَض (الدَّين) الذي عند الغير؟","نعم، عند جمهور الفقهاء تجب الزكاة على الدين إذا كان على شخص مليء يُرجى سداده، ويمكن إخراجها كل سنة أو عند قبض المال حسب الراجح عند بعض أهل العلم."],
["أسئلة شائعة","متى يبدأ وقت صلاة الفجر ومتى ينتهي؟","يبدأ وقت الفجر بطلوع الفجر الصادق (الخيط الأبيض المعترض في الأفق)، وينتهي بطلوع الشمس."],
["أسئلة شائعة","كم عدد ركعات الصلوات الخمس المفروضة؟","الفجر ركعتان، والظهر أربع ركعات، والعصر أربع ركعات، والمغرب ثلاث ركعات، والعشاء أربع ركعات."],
["أسئلة شائعة","ما حكم من نام عن صلاة أو نسيها؟","يجب عليه أن يصليها فور استيقاظه أو تذكّرها، لحديث: (من نام عن صلاة أو نسيها فليصلّها إذا ذكرها، لا كفارة لها إلا ذلك)."],
["أسئلة شائعة","هل يجوز الجمع بين الصلاتين؟","يجوز الجمع بين الظهر والعصر، وبين المغرب والعشاء، للمسافر سفر قصر، وللمريض ومن في حكمه، وفي المطر الشديد عند بعض أهل العلم، وذلك تيسيرًا ورفعًا للحرج."]
];
document.getElementById('qaList').innerHTML = qaData.map((q,i)=>`
  <div class="qa">
    <button class="q" data-i="${i}">
      <span>${q[1]}</span>
      <span class="tag">${q[0]}</span>
      <span class="plus">+</span>
    </button>
    <div class="a"><p>${q[2]}</p></div>
  </div>
`).join('');
document.getElementById('qaList').addEventListener('click', e=>{
  const btn = e.target.closest('button.q');
  if(!btn) return;
  btn.closest('.qa').classList.toggle('open');
});
</script>
<script src="app.js"></script>
